# TerranovaLib: dialogue HUD
#
# Use it in a BetonQuest conversation with
#   conversationIO: terranova_hud
#   interceptor: none
# or for every conversation in BetonQuest's config.yml:
#   conversation.default_io: terranova_hud,menu,tellraw
#   conversation.interceptor.default: none
#
# Without "interceptor: none", BetonQuest holds back all chat while the NPC
# talks, which only makes sense for conversations shown in the chat.

hud:
  # How often a running dialogue is updated, in ticks. Drives the typing effect.
  update-interval-ticks: 2

  # The client fades an actionbar message out after about three seconds, so the
  # current line is sent again at least this often (in ticks) while nothing changes.
  keepalive-ticks: 30

  # Width of one line in GUI pixels, measured with Minecraft's own font widths:
  # NPC name, text and the page arrow together. The hotbar is 182 px wide. At GUI
  # scale 4 on a 1080p screen the whole screen is 480 px wide, so stay below ~400.
  max-text-width: 300

  # Lines per page. Lines stack upwards from the actionbar, 10 px apart, so a
  # 6-line page covers about 70 px above the hotbar. Needs the row fonts and a
  # frame per line count in the resource pack (see the README); without them, or
  # without the pack, every page is a single line.
  max-lines: 6

  # The frame is at least this many lines high, even for a single short sentence;
  # the text starts at the top. Default 2.
  min-lines: 2

  # Reveal the NPC text a few characters at a time. Any "next" input completes the
  # page at once.
  typing-effect: true
  typing-chars-per-update: 2

  # When a conversation ends on an NPC line without answers, that line stays on
  # screen for this many ticks after it is fully shown. 0 removes it at once.
  epilogue-ticks: 60

# MiniMessage. Placeholders: <icon> <name> <text> <page> <pages> <selector> <option>
# <index> <count>. Text and names come from BetonQuest, already formatted and translated.
#
# With more than one line, answers are shown as a list: a header line (prefix +
# choose) and one line per answer, `option` for the selected one, `option-idle` for
# the others. With a single line, one answer at a time is shown with `option`.
format:
  prefix: "<icon><gold><name></gold> <dark_gray>│</dark_gray> "
  next-page: " <gray>▶</gray>"
  # Appended after the arrow when an NPC line has more than one page.
  progress: " <dark_gray><page>/<pages></dark_gray>"
  option: "<selector><yellow><option></yellow>"
  option-idle: "<gray>   <option></gray>"
  choose: "<gray>Antworte:</gray> <dark_gray>(<index>/<count>)</dark_gray>"
  # Used for <selector> when no selector glyph is configured or available.
  selector: "<white>» </white>"

glyphs:
  # Draw a frame behind the text with Nexo glyphs. The glyph definitions and
  # textures that go with these ids are in the plugin's README.
  enabled: true
  frame-left: dialogue_left
  frame-right: dialogue_right
  # Middle tiles of any widths. The frame is assembled from them greedily, widest
  # first, so a 1 px tile makes every width exact. They must be uniform columns.
  #
  # These ids are the one-line frame. The frame for N lines uses the same ids with
  # "_N" appended (dialogue_left_3, dialogue_mid_128_3, ...).
  frame-middle:
    - dialogue_mid_128
    - dialogue_mid_64
    - dialogue_mid_32
    - dialogue_mid_16
    - dialogue_mid_8
    - dialogue_mid_4
    - dialogue_mid_2
    - dialogue_mid_1
  # Font of text row N above the actionbar line ({row} = 1..5), generated by
  # tools/row_fonts.py from Minecraft's own font.
  row-font: "terranova:dialogue_row{row}"
  # Space between the frame's inner edge and the text on the left and right, in
  # GUI pixels: at least `padding`, and `padding-ratio` of the line width for
  # longer lines (0.05 gives a 220 px line 11 px on each side).
  padding: 8
  padding-ratio: 0.05
  # Optional glyph id for <selector>. Empty uses format.selector.
  selector: ""
  # Optional glyph per conversation, shown as <icon>. Key: the full conversation id
  # (package>conversation), or "default" for all others.
  npc-icons: {}
  #   "harbour>rotbart": npc_rotbart

input:
  # Vanilla inputs the server can see. Choose from RIGHT_CLICK, LEFT_CLICK,
  # SWAP_HANDS (F), JUMP and SNEAK.
  #
  # RIGHT_CLICK into the air only reaches the server while holding an item;
  # clicking the NPC or a block always works.
  next: [RIGHT_CLICK, LEFT_CLICK, SWAP_HANDS, JUMP]
  confirm: [RIGHT_CLICK, LEFT_CLICK, SWAP_HANDS, JUMP]
  # Ends the conversation, unless the conversation blocks movement (stop: true).
  cancel: [SNEAK]
  # Pick answers with the mouse wheel / hotbar keys. The held slot does not change
  # while an answer is being chosen.
  scroll: true
  # Ignore a second input this soon after the first, in milliseconds. A single
  # click can reach the server as two events.
  debounce-ms: 150

selection:
  # Show more answers than this in the fallback below instead of the actionbar.
  max-hud-options: 6

fallback:
  # Each value is a BetonQuest conversation IO name (dialog, menu, chest, simple,
  # tellraw, ...), a comma-separated list of them where the first available wins,
  # or "plain": this HUD in vanilla text, without any glyphs.
  #
  # Player has not loaded the server resource pack (declined, failed, still loading).
  # A player without any pack status counts as loaded: behind NexoProxy, a server
  # switch reaches this server without one. Needs the pack to be mandatory.
  no-resourcepack: dialog
  # Nexo is missing, glyphs are disabled, or a frame glyph or its texture is missing.
  no-glyphs: plain
  # More answers than selection.max-hud-options.
  long-option-list: dialog
