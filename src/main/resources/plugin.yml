name: TerranovaLib
version: '${version}'
main: de.mcterranova.terranovaLib.TerranovaLib
api-version: '${minecraftVersion}'
authors: [Bastizeit, gerryxn]
prefix: TerraNovaLib
website: mcterranova.de
description: Lib for TerraNova Server.
# Not BetonQuest: the lib has to load before Nexo (BountyfulSeas) and BetonQuest loads after Nexo.
# Ghost blocks and NPCs hook into BetonQuest when it enables (PluginHooks). Paper then warns once
# that the lib loaded a class from BetonQuest without depending on it; that is expected.
softdepend: [Votifier, Citizens, HeroicMap]
commands:
  vote:
    description: Shows the links to vote for the server.
    usage: /vote
    aliases: [voten]
permissions:
  dialoguehud.admin:
    description: Allows /dialoguehud reload and /dialoguehud preview.
    default: op
  ghostblocks.admin:
    description: Allows /ghostblocks.
    default: op
  terranovanpcs.admin:
    description: Allows /tnpc reload, list and adopt.
    default: op
