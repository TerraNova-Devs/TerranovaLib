import io.papermc.paperweight.userdev.ReobfArtifactConfiguration

plugins {
    id("io.papermc.paperweight.userdev") version "2.0.0-beta.23"
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id 'maven-publish'
    id 'java'
    id "com.gradleup.shadow" version "9.0.0"
}

group = 'de.mcterranova.terranovaLib'
version = '1.0.1'
description = 'Lib for TerraNova Server.'

ext {
    minecraftVersion = '26.3'
    nexoVersion = '1.27.0'
}

java {
    // Configure the Java toolchain to use Java 25
    toolchain.languageVersion = JavaLanguageVersion.of(25)

    // Set source and target compatibility
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
    gradlePluginPortal()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "Nexo"
        url = "https://repo.nexomc.com/releases"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "JitPack"
                url = "https://jitpack.io"
            }
        }
        filter { includeGroup "com.github.NuVotifier.NuVotifier" }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "BetonQuest"
                url = "https://repo.betonquest.org/betonquest/"
                // only the plugin jar is needed; its POMs pull in a chain of parent POMs
                metadataSources { artifact() }
            }
        }
        filter { includeGroup "org.betonquest" }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Citizens"
                url = "https://maven.citizensnpcs.co/repo"
            }
        }
        filter { includeGroup "net.citizensnpcs" }
    }
}

paperweight {
    paperweight.reobfArtifactConfiguration = ReobfArtifactConfiguration.getMOJANG_PRODUCTION()
    // Spigot Mappings
    // reobfArtifactConfiguration = ReobfArtifactConfiguration.getREOBF_PRODUCTION()
}

dependencies {
    paperweight.paperDevBundle("${minecraftVersion}.build.+")
    compileOnly("com.nexomc:nexo:${nexoVersion}")
    // NuVotifier is only a soft dependency; without it VoteEvent is never fired
    compileOnly("com.github.NuVotifier.NuVotifier:nuvotifier-api:2.7.2")
    compileOnly("com.github.NuVotifier.NuVotifier:nuvotifier-bukkit:2.7.2")
    // BetonQuest is only a soft dependency of ghost blocks and NPCs. This snapshot is the plugin jar of
    // 3.3.0-DEV-52, the build the servers run; the NPCs also use its internal CitizensAdapter.
    // ponytail: snapshots may be cleaned from the repo, then pin the next DEV build the servers run
    compileOnly("org.betonquest:betonquest:3.3.0-20261014.114053-50:shaded") { transitive = false }
    // Citizens for the NPCs, soft dependency; its traits are in the main jar, not the API
    compileOnly("net.citizensnpcs:citizens-main:2.0.44-SNAPSHOT") { transitive = false }
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (JavaVersion.current().isJava10Compatible()) {
        options.release.set(25)
    }
}

processResources {
    def props = [
            version         : version,
            minecraftVersion: minecraftVersion
    ]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

tasks.named("runServer") {
    minecraftVersion(project.ext.minecraftVersion)
}

// Task to generate sources JAR
tasks.register('sourcesJar', Jar) {
    from sourceSets.main.allSource
    archiveClassifier.set("sources")
    description = "Generates a JAR containing the source code."
    group = "Build"
}

// Task to generate Javadoc JAR (optional)
tasks.register('javadocJar', Jar) {
    from javadoc
    archiveClassifier.set("javadoc")
    description = "Generates a JAR containing the Javadoc."
    group = "Documentation"
}

tasks.named('javadocJar') {
    dependsOn 'javadoc'
}

// Configure the Javadoc task to be more lenient
tasks.withType(Javadoc).configureEach {
    // Set the encoding for JavaDoc
    options.encoding = 'UTF-8'

    // Link to the Java 21 API documentation
    options.links("https://docs.oracle.com/en/java/javase/21/docs/api/")

    // Disable all Doclint checks to suppress warnings
    options.addBooleanOption('Xdoclint:none', true)

    // Prevent JavaDoc warnings from failing the build
    failOnError = false
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = 'de.mcterranova'
            artifactId = 'terranova-lib'
            version = version

            // Include the sources JAR
            artifact sourcesJar

            // Include the javadoc JAR (optional)
            artifact javadocJar
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/TerraNova-Devs/TerranovaLib")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                password = project.findProperty("gpr.token") ?: System.getenv("GITHUB_TOKEN")
            }
        }
    }
}

shadowJar {
    destinationDirectory.set(file("../Nations/testserver/plugins"))
    archiveClassifier.set('all')
}

tasks.build {
    dependsOn tasks.shadowJar
}

// Ensure that publishing depends on sourcesJar and javadocJar
tasks.withType(PublishToMavenRepository).configureEach {
    dependsOn tasks.named("sourcesJar")
    dependsOn tasks.named("javadocJar")
}
