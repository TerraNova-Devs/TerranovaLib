# Dialogue HUD frame. Copy this nexo/ folder's contents into plugins/Nexo/ (the
# textures are under pack/assets/minecraft/textures/terranova/dialogue/), then run
# /nexo reload all and /dialoguehud reload.
#
# height 22 with ascent 14 puts the 8 px vanilla text line in the middle: 3 px
# border and 4 px of fill above and below it (16 px looked squeezed, 16.10.).
# The glyphs live in their own font, so their characters never collide with
# anything typed in chat.
#
# Never change a char once the pack is live: it is baked into the generated pack.

dialogue_left:
  texture: terranova/dialogue/dialogue_left
  font: terranova:dialogue
  char: ""
  ascent: 14
  height: 22

